name: Daily Threat Intelligence Collection

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-threat-intel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public advisories, research feeds and CISA KEV
        run: python scripts/collect_threat_intel.py
      - name: Run static detection query quality checks
        run: python scripts/validate_detection_queries.py
      - name: Commit dated intelligence artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/ detection-queries/generated/
          if git diff --cached --quiet; then
            echo "No intelligence changes to commit."
          else
            git commit -m "Daily threat intelligence snapshot $(date -u +%F)"
            git push
          fi
