name: Daily Threat Intelligence Collection

on:
  push:
    branches:
      - main
    paths:
      - "scripts/collect_threat_intel.py"
      - "scripts/validate_dashboard.py"
      - "scripts/validate_detection_queries.py"
      - "scripts/validate_frontend_security.py"
      - "index.html"
      - ".github/workflows/daily-threat-intel.yml"
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "index.html"
      - "detection-queries/**"
      - ".github/workflows/daily-threat-intel.yml"

permissions:
  contents: read

concurrency:
  group: daily-threat-intel
  cancel-in-progress: false

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate dashboard, collector, CVE coverage and business classifications
        run: python scripts/validate_dashboard.py
      - name: Validate frontend security and safe rendering
        run: python scripts/validate_frontend_security.py
      - name: Validate detection query metadata and KQL structure
        run: python scripts/validate_detection_queries.py

  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Collect public advisories, research feeds and CISA KEV
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect_threat_intel.py
      - name: Validate newly collected intelligence snapshot and dashboard
        run: python scripts/validate_dashboard.py
      - name: Run static detection query quality checks
        run: python scripts/validate_detection_queries.py
      - name: Commit raw intelligence to isolated staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B intel-staging origin/main
          git add intel/ detection-queries/generated/
          if git diff --cached --quiet; then
            echo "No intelligence changes to stage."
            exit 0
          fi
          git commit -m "Raw intelligence staging $(date -u +%F)"
          git push --force-with-lease origin HEAD:intel-staging
          echo "Raw intelligence staged on intel-staging. Main and GitHub Pages were not changed."
