name: Daily Threat Intelligence Collection

on:
  push:
    branches: [main]
    paths:
      - "scripts/collect_threat_intel.py"
      - "scripts/validate_dashboard.py"
      - "scripts/validate_detection_queries.py"
      - "scripts/validate_frontend_security.py"
      - "index.html"
      - "intel/**"
      - "reports/**"
      - ".github/workflows/daily-threat-intel.yml"
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-threat-intel
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Collect public advisories, research feeds and CISA KEV
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect_threat_intel.py
      - name: Validate newly collected intelligence snapshot and dashboard
        run: python scripts/validate_dashboard.py
      - name: Run static detection query quality checks
        run: python scripts/validate_detection_queries.py
      - name: Commit dated intelligence artifacts with conflict recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/ detection-queries/generated/
          if git diff --cached --quiet; then
            echo "No intelligence changes to commit."
            exit 0
          fi
          git commit -m "Daily threat intelligence snapshot $(date -u +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Intelligence artifacts pushed successfully."
              exit 0
            fi
            echo "Concurrent daily run changed the same dated files; regenerating from latest main (attempt $attempt)."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/collect_threat_intel.py
            python scripts/validate_detection_queries.py
            git add intel/ detection-queries/generated/
            if git diff --cached --quiet; then
              echo "Latest main already contains the current intelligence snapshot."
              exit 0
            fi
            git commit -m "Daily threat intelligence snapshot $(date -u +%F) retry $attempt"
          done
          echo "Unable to publish intelligence artifacts after three conflict-recovery attempts."
          exit 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Check out latest published repository state
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify checked-out main revision
        run: |
          checked_out="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "Pages artifact source SHA: ${checked_out}"
          echo "Remote main SHA: ${remote_main}"
          if [ "${checked_out}" != "${remote_main}" ]; then
            echo "::error::Pages artifact checkout is not current main."
            exit 1
          fi
          echo "Latest intelligence pointer:"
          cat intel/latest.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload dashboard and latest intelligence artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" --jq '.total_count')
            if [ "${count}" -ge 1 ]; then
              echo "Pages artifact is visible to the deployment token."
              exit 0
            fi
            echo "Artifact not visible yet (attempt ${attempt}/12); retrying in 5 seconds."
            sleep 5
          done
          echo "::error::Pages artifact did not become visible to the deployment token."
          exit 1
      - name: Allow Pages artifact metadata to settle
        run: sleep 20
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
