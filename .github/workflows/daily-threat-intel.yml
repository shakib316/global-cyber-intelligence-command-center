name: Daily Threat Intelligence Collection

on:
  push:
    paths:
      - "scripts/collect_threat_intel.py"
      - ".github/workflows/daily-threat-intel.yml"
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-threat-intel
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public advisories, research feeds and CISA KEV
        run: python scripts/collect_threat_intel.py
      - name: Run static detection query quality checks
        run: python scripts/validate_detection_queries.py
      - name: Commit dated intelligence artifacts with conflict recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/ detection-queries/generated/
          if git diff --cached --quiet; then
            echo "No intelligence changes to commit."
            exit 0
          fi
          git commit -m "Daily threat intelligence snapshot $(date -u +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Intelligence artifacts pushed successfully."
              exit 0
            fi
            echo "Concurrent daily run changed the same dated files; regenerating from latest main (attempt $attempt)."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/collect_threat_intel.py
            python scripts/validate_detection_queries.py
            git add intel/ detection-queries/generated/
            if git diff --cached --quiet; then
              echo "Latest main already contains the current intelligence snapshot."
              exit 0
            fi
            git commit -m "Daily threat intelligence snapshot $(date -u +%F) retry $attempt"
          done
          echo "Unable to publish intelligence artifacts after three conflict-recovery attempts."
          exit 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Check out latest published repository state
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard and latest intelligence artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
