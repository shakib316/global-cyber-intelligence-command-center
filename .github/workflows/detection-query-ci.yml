name: Detection Query Quality Checks

on:
  push:
    paths:
      - "detection-queries/**"
      - "scripts/validate_detection_queries.py"
      - ".github/workflows/detection-query-ci.yml"
  pull_request:
    paths:
      - "detection-queries/**"
      - "scripts/validate_detection_queries.py"
      - ".github/workflows/detection-query-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detection-query-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Metadata and repository quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate detection query library
        run: python scripts/validate_detection_queries.py
