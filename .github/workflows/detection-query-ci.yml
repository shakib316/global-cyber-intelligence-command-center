name: Detection Query Quality Checks

on:
  push:
    paths:
      - "detection-queries/**"
      - "scripts/validate_detection_queries.py"
      - "scripts/validate_detection_formats.py"
      - "scripts/validate_frontend_security.py"
      - "scripts/validate_dashboard.py"
      - "scripts/collect_threat_intel.py"
      - "index.html"
      - ".github/workflows/detection-query-ci.yml"
  pull_request:
    paths:
      - "detection-queries/**"
      - "scripts/validate_detection_queries.py"
      - "scripts/validate_detection_formats.py"
      - "scripts/validate_dashboard.py"
      - "scripts/collect_threat_intel.py"
      - "index.html"
      - ".github/workflows/detection-query-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detection-query-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Metadata and repository quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node for dashboard JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate dashboard, collector, CVE extraction and business classification
        run: python scripts/validate_dashboard.py
      - name: Validate detection query metadata and KQL structure
        run: python scripts/validate_detection_queries.py
      - name: Validate frontend security and safe rendering
        run: python scripts/validate_frontend_security.py
      - name: Validate SPL and YARA-L metadata and structure
        run: python scripts/validate_detection_formats.py
