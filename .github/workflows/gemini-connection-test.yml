name: Gemini API Connection Test

on:
  push:
    branches:
      - feature/gemini-api-secret-wiring
    paths:
      - ".github/workflows/gemini-connection-test.yml"

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Gemini API key and text generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("FAIL: GEMINI_API_KEY is not available to this workflow.")
              sys.exit(1)

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent"
          payload = {
              "contents": [{
                  "parts": [{
                      "text": "Reply with exactly this text and nothing else: GEMINI_CONNECTION_OK"
                  }]
              }],
              "generationConfig": {"temperature": 0, "maxOutputTokens": 40}
          }
          body = json.dumps(payload).encode("utf-8")

          for attempt in range(1, 5):
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": api_key
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  candidates = result.get("candidates") or []
                  parts = candidates[0].get("content", {}).get("parts", []) if candidates else []
                  generated_text = "".join(part.get("text", "") for part in parts).strip()
                  if not generated_text:
                      print("FAIL: Gemini returned HTTP 200 but no generated text.")
                      print(json.dumps(result)[:2000])
                      sys.exit(1)
                  print("PASS: Gemini API request succeeded (HTTP 200).")
                  print("Gemini response:", generated_text)
                  sys.exit(0)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  if error.code in (429, 500, 502, 503, 504) and attempt < 4:
                      delay = 5 * (2 ** (attempt - 1))
                      print(f"Gemini returned transient HTTP {error.code}; retry {attempt}/3 in {delay}s.")
                      time.sleep(delay)
                      continue
                  print(f"FAIL: Gemini API returned HTTP {error.code}.")
                  print(detail[:2000])
                  sys.exit(1)
              except Exception as error:
                  print(f"FAIL: Gemini test could not complete: {type(error).__name__}: {error}")
                  sys.exit(1)
          PY
