name: Dashboard Quality Watch
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/collect_threat_intel.py"
      - "scripts/validate_dashboard.py"
      - "scripts/validate_frontend_security.py"
      - "intel/**"
      - "reports/**"
      - ".github/workflows/dashboard-quality-watch.yml"
  workflow_run:
    workflows:
      - Daily Threat Intelligence Collection
      - Deploy GCI dashboard to GitHub Pages
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-quality-watch
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate dashboard and latest data
        run: python scripts/validate_dashboard.py
      - name: Validate frontend security and safe rendering
        run: python scripts/validate_frontend_security.py
